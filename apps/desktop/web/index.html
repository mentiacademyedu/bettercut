<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>bettercut</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #111318;
      color: #9ca3af;
      font: 14px system-ui, sans-serif;
    }
    /* The app draws everything; the canvas fills the page. */
    #bettercut {
      display: block;
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      outline: none;
    }
    #status {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      text-align: center;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <canvas id="bettercut"></canvas>
  <p id="status">Loading bettercut…</p>
  <script type="module">
    import init from './bettercut.js';
    // Whole stack traces in the console when something panics.
    Error.stackTraceLimit = 60;
    init().catch((err) => {
      document.getElementById('status').textContent =
        'bettercut could not start in this browser: ' + err;
    });
  </script>
</body>
</html>
