<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>bettercut</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #111318;
      color: #9ca3af;
      font: 14px system-ui, sans-serif;
    }
    /* The app draws everything; the canvas fills the page. */
    #bettercut {
      display: block;
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      outline: none;
    }
    #status {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      text-align: center;
      pointer-events: none;
    }
    /* Files held over the page. */
    #drop {
      position: absolute;
      inset: 12px;
      display: none;
      align-items: center;
      justify-content: center;
      border: 2px dashed #748cfa;
      border-radius: 10px;
      background: rgba(17, 19, 24, 0.6);
      color: #e5e7ed;
      font-size: 16px;
      pointer-events: none;
    }
    #drop.on {
      display: flex;
    }
  </style>
</head>
<body>
  <canvas id="bettercut"></canvas>
  <p id="status">Loading bettercut…</p>
  <div id="drop">Drop to import — onto the timeline to add it there too</div>
  <script>
    // Browsers start sound paused until the person does something on the
    // page. The app's audio output is made at start-up, before that, so
    // every one made is remembered and woken at the first click or key —
    // and playback, whose clock is that output, moves only once it is.
    // A plain script, so this runs before the module below: the app's glue
    // takes its own copy of AudioContext as soon as it is imported.
    (() => {
      const contexts = [];
      const Original = window.AudioContext;
      if (!Original) return;
      window.AudioContext = class extends Original {
        constructor(...args) {
          super(...args);
          contexts.push(this);
        }
      };
      const wake = () => {
        for (const context of contexts) if (context.state === 'suspended') context.resume();
      };
      for (const kind of ['pointerdown', 'keydown']) window.addEventListener(kind, wake, true);
    })();
  </script>
  <script type="module">
    import init from './bettercut.js';
    // Whole stack traces in the console when something panics.
    Error.stackTraceLimit = 60;

    // Files dropped on the page go to the app's media layer as they are —
    // the browser's own File, read when needed — rather than through egui,
    // which would copy every byte of them into memory first. So the page
    // takes the drag before the canvas sees it.
    const drop = document.getElementById('drop');
    const hasFiles = (e) => e.dataTransfer && [...e.dataTransfer.types].includes('Files');
    window.addEventListener('dragover', (e) => {
      if (!hasFiles(e)) return;
      e.preventDefault();
      e.stopPropagation();
      e.dataTransfer.dropEffect = 'copy';
      drop.classList.add('on');
    }, true);
    window.addEventListener('dragleave', (e) => {
      if (e.relatedTarget === null) drop.classList.remove('on');
      e.stopPropagation();
    }, true);
    window.addEventListener('drop', (e) => {
      drop.classList.remove('on');
      if (!hasFiles(e)) return;
      e.preventDefault();
      e.stopPropagation();
      globalThis.bettercutMedia?.dropped([...e.dataTransfer.files], e.clientX, e.clientY);
    }, true);

    // `?media=<url>[&media=<url>…]`: open files from this site as if they
    // were dropped on the timeline — for a demo, or for testing.
    async function openFromAddress() {
      const urls = new URLSearchParams(location.search).getAll('media');
      const files = [];
      for (const url of urls) {
        const response = await fetch(url);
        if (!response.ok) continue;
        const blob = await response.blob();
        files.push(new File([blob], url.split('/').pop(), { type: blob.type }));
      }
      if (files.length) {
        globalThis.bettercutMedia?.dropped(files, innerWidth / 2, innerHeight * 0.85);
      }
    }

    // What was kept in this browser last time is read before the app
    // starts, so the project it opens has its files.
    globalThis.bettercutMedia
      .restore()
      .then(() => init())
      .then(openFromAddress)
      .catch((err) => {
        document.getElementById('status').textContent =
          'bettercut could not start in this browser: ' + err;
      });
  </script>
</body>
</html>
