[package]
name = "frame-transport-spike"
version = "0.0.0"
edition = "2024"
publish = false

# Milestone 0 (§82). THROWAWAY CODE. Deleted once ADR 005 is written.
# Deliberately NOT a workspace member.

[dependencies]
eframe = "0.36"          # default features already include wgpu (and not glow)
cpal = "0.18"

[profile.dev]
opt-level = 1            # the synthetic frame generator is unusable at opt-level 0

[profile.dev.package."*"]
opt-level = 3
