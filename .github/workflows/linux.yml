# bettercut on Linux: GitHub's Ubuntu machines build it, run the tests,
# package an AppImage and take a screenshot of the app.
# The machines have no GPU; Mesa's software Vulkan driver (lavapipe) stands
# in, because its OpenGL one is a reduced device without the texture views the
# compositor needs. Free for public repositories.
name: Linux

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      FFMPEG_PREFIX: ${{ github.workspace }}/vendor/ffmpeg-linux
    steps:
      - uses: actions/checkout@v4

      # FFmpeg's own needs, then what the app's window, sound and file
      # dialogs link against.
      - name: Tools and libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential nasm pkg-config \
            libopenh264-dev libzimg-dev libdav1d-dev libvpx-dev libva-dev \
            libasound2-dev libxkbcommon-dev libwayland-dev libx11-dev \
            libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev libgtk-3-dev \
            mesa-vulkan-drivers libvulkan1 xvfb libxkbcommon-x11-0

      - name: Cache FFmpeg
        id: ffmpeg-cache
        uses: actions/cache@v4
        with:
          path: vendor/ffmpeg-linux
          key: ffmpeg-linux-${{ runner.arch }}-${{ hashFiles('docs/fetch-ffmpeg-linux.sh') }}

      - name: Build FFmpeg (LGPL)
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: bash docs/fetch-ffmpeg-linux.sh "$FFMPEG_PREFIX"

      - name: Rust
        run: rustup show

      - name: Cache Rust build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-linux-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: cargo-linux-${{ runner.arch }}-

      - name: Point the build at FFmpeg
        run: |
          {
            echo "FFMPEG_INCLUDE_DIR=$FFMPEG_PREFIX/include"
            echo "FFMPEG_LIBS_DIR=$FFMPEG_PREFIX/lib"
            echo "FFMPEG_LINK_MODE=dynamic"
            echo "BETTERCUT_FFMPEG_BIN=$FFMPEG_PREFIX/lib"
            echo "LD_LIBRARY_PATH=$FFMPEG_PREFIX/lib"
            # The software Vulkan driver, not the reduced OpenGL device.
            echo "WGPU_BACKEND=vulkan"
          } >> "$GITHUB_ENV"

      - name: Build
        id: build
        run: cargo build --workspace --all-targets

      # Every test group runs even after one fails, so one run shows
      # everything that breaks on Linux.
      - name: Test
        run: cargo test --workspace --no-fail-fast -- --test-threads=2

      - name: Clippy
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: cargo clippy --workspace --all-targets -- -D warnings

      # From here on, a failed test does not stop the rest: the AppImage and
      # the screenshot are still worth having while a test is being fixed.
      - name: Packaging tools
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          cargo install cargo-about --locked --features cli
          curl -sSfL -o linuxdeploy \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy

      - name: Package
        id: package
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: bash docs/package-linux.sh

      - name: Upload the AppImage
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: bettercut-linux-appimage
          path: dist/*.AppImage

      # The app's own screenshot (BETTERCUT_SCREENSHOT), of the sample
      # project, on a virtual display with the software Vulkan driver.
      - name: Screenshot
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        continue-on-error: true
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: |
          BETTERCUT_SCREENSHOT="$PWD/dist/linux.png" BETTERCUT_SAMPLE=1 \
            xvfb-run -a -s "-screen 0 1600x1000x24" dist/bettercut-*.AppImage &
          for i in $(seq 1 120); do
            [ -f dist/linux.png ] && break
            sleep 1
          done
          pkill -f bettercut || true
          test -f dist/linux.png

      - name: Upload the screenshot
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: bettercut-linux-shot
          path: dist/linux.png
          if-no-files-found: ignore
