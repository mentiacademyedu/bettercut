# bettercut on Linux: GitHub's Ubuntu machines build it and run the tests.
# The machines have no GPU, so the tests that need one skip themselves.
# Free for public repositories.
name: Linux

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      FFMPEG_PREFIX: ${{ github.workspace }}/vendor/ffmpeg-linux
    steps:
      - uses: actions/checkout@v4

      # FFmpeg's own needs, then what the app's window, sound and file
      # dialogs link against.
      - name: Tools and libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential nasm pkg-config \
            libopenh264-dev libzimg-dev libdav1d-dev libvpx-dev libva-dev \
            libasound2-dev libxkbcommon-dev libwayland-dev libx11-dev \
            libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev libgtk-3-dev

      - name: Cache FFmpeg
        id: ffmpeg-cache
        uses: actions/cache@v4
        with:
          path: vendor/ffmpeg-linux
          key: ffmpeg-linux-${{ runner.arch }}-${{ hashFiles('docs/fetch-ffmpeg-linux.sh') }}

      - name: Build FFmpeg (LGPL)
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: bash docs/fetch-ffmpeg-linux.sh "$FFMPEG_PREFIX"

      - name: Rust
        run: rustup show

      - name: Cache Rust build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-linux-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: cargo-linux-${{ runner.arch }}-

      - name: Point the build at FFmpeg
        run: |
          {
            echo "FFMPEG_INCLUDE_DIR=$FFMPEG_PREFIX/include"
            echo "FFMPEG_LIBS_DIR=$FFMPEG_PREFIX/lib"
            echo "FFMPEG_LINK_MODE=dynamic"
            echo "BETTERCUT_FFMPEG_BIN=$FFMPEG_PREFIX/lib"
            echo "LD_LIBRARY_PATH=$FFMPEG_PREFIX/lib"
          } >> "$GITHUB_ENV"

      - name: Build
        id: build
        run: cargo build --workspace --all-targets

      # Every test group runs even after one fails, so one run shows
      # everything that breaks on Linux.
      - name: Test
        run: cargo test --workspace --no-fail-fast -- --test-threads=2

      - name: Clippy
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: cargo clippy --workspace --all-targets -- -D warnings
