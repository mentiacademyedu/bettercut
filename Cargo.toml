[workspace]
resolver = "3"
members = [
    "apps/desktop",
    "apps/mcp",
    "crates/foundation",
    "crates/timeline",
    "crates/media",
    "crates/audio",
    "crates/renderer",
    "crates/playback",
    "crates/jobs",
    "crates/cache",
    "crates/project-format",
    "crates/export",
    "crates/editor-core",
    "crates/captions",
    "crates/templates",
    "crates/text",
    "crates/ui",
]
# Milestone 0 spike (§82) is deliberately excluded — it is throwaway code and
# must never be built as part of the product.
exclude = ["spike"]

[workspace.package]
version = "0.6.10"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
bettercut-foundation = { path = "crates/foundation" }
bettercut-timeline = { path = "crates/timeline" }
bettercut-media = { path = "crates/media" }
bettercut-audio = { path = "crates/audio" }
bettercut-renderer = { path = "crates/renderer" }
bettercut-playback = { path = "crates/playback" }
bettercut-export = { path = "crates/export" }
bettercut-jobs = { path = "crates/jobs" }
bettercut-cache = { path = "crates/cache" }
bettercut-project-format = { path = "crates/project-format" }
bettercut-editor-core = { path = "crates/editor-core" }
bettercut-text = { path = "crates/text" }
bettercut-captions = { path = "crates/captions" }
bettercut-templates = { path = "crates/templates" }
bettercut-ui = { path = "crates/ui" }
bettercut-mcp = { path = "apps/mcp" }

# Kept deliberately short. §74: "Add large dependencies without justification."
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
eframe = "0.36"
egui = "0.36"
# Tests only, and not really a new dependency: wgpu already compiles every
# shader through this exact version at run time. Pulling it in directly lets
# the WGSL be parsed and type-checked by `cargo test`, on a machine with no
# GPU, instead of failing when the first frame is drawn.
naga = { version = "30", features = ["wgsl-in"] }

# §26.1: text must be shaped and rasterized by *one* implementation, used
# identically by preview and export — otherwise the two disagree on hinting,
# subpixel positioning and font fallback, and §46 breaks where users notice it
# first. This is the crate the guide names for it.
#
# §26 also names `swash` for rasterization. It is not listed separately because
# cosmic-text *is* the swash front end: its `SwashCache` is swash, and adding
# the crate again would only give us a second way to call the same rasterizer.
cosmic-text = { version = "0.19", default-features = false, features = [
    "std",
    "swash",
    "fontconfig",
] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
# §71: clippy denies warnings in CI. These are the rules the guide states
# explicitly, promoted from review convention to compiler enforcement.
unwrap_used = "warn"
expect_used = "warn"
float_arithmetic = "allow"      # allowed generally; forbidden in timeline math by review (§74)

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
