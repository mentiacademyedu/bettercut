[package]
name = "bettercut-media"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
bettercut-foundation.workspace = true
serde.workspace = true
thiserror.workspace = true
tracing.workspace = true

# FFmpeg FFI. This is the ONLY crate that may name an FFmpeg type (§86);
# everything else goes through the traits in `decoder.rs`.
#
# `use_prebuilt_binding` means no LLVM/libclang is needed to build this project.
# See docs/adr/002-ffmpeg-backend.md for why this rather than rsmpeg.
rusty_ffmpeg = { version = "0.17", features = ["use_prebuilt_binding", "ffmpeg8_1"] }

[dev-dependencies]
serde_json.workspace = true
tempfile = "3"

# NOT `workspace = true`. The workspace forbids `unsafe_code`; this crate is the
# single documented exception, because it is the only crate that talks to
# FFmpeg's C API (§86). Every `unsafe` block lives under `src/ffmpeg/` and is
# wrapped by the safe traits in `src/decoder.rs`.
[lints.rust]
unsafe_code = "allow"

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
