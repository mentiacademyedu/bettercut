[package]
name = "bettercut-renderer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
bettercut-foundation.workspace = true
bettercut-timeline.workspace = true
bettercut-media.workspace = true
thiserror.workspace = true
tracing.workspace = true

# The same wgpu the UI already has. Taken through eframe's re-export so the
# versions cannot drift: two wgpu versions in one process means two devices,
# and a texture from one is unusable by the other.
eframe.workspace = true

[dev-dependencies]
naga.workspace = true
# Only to drive wgpu's async device setup from a synchronous test. wgpu
# already depends on it, so this adds nothing to the build.
pollster = "0.4"

[lints]
workspace = true
